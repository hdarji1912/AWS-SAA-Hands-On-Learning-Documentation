AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  QuickCart Day 18 end-to-end order application. Creates an EC2-hosted UI,
  API Gateway HTTP API, Lambda functions, a Standard Step Functions workflow,
  DynamoDB order storage, CloudWatch Logs permissions, and least-privilege IAM roles.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment used in resource names and tags.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which the EC2 web server will be created.

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Public subnet in the selected VPC. Its route table must have a route to an
      internet gateway so the UI receives a reachable public address.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type for the demonstration web server.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$
    ConstraintDescription: Enter an IPv4 CIDR such as 203.0.113.10/32.
    Description: >-
      IPv4 CIDR allowed to access the QuickCart UI on port 80.
      Use your-public-IP/32 when possible.

  QueueVisibilityTimeout:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 43200
    Description: Visibility timeout for the Lambda failure destination queue.

Resources:

  LambdaFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub quickcart-lambda-failure-${Environment}-day18
      VisibilityTimeout: !Ref QueueVisibilityTimeout
      MessageRetentionPeriod: 345600

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  ArchiveBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub quickcart-archive-${Environment}-day18-${AWS::AccountId}

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  OrdersTable:
    Type: AWS::DynamoDB::Table

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:
      TableName: !Sub quickcart-orders-${Environment}-iac-day18

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S

      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  ValidateOrderRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Tags:
        - Key: Project
          Value: QuickCart-Day18


  OrderWorkerRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: UpdateOrderStatus

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - dynamodb:UpdateItem

                Resource: !GetAtt OrdersTable.Arn

      Tags:
        - Key: Project
          Value: QuickCart-Day18


  GetOrderStatusRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: ReadOrderStatus

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - dynamodb:GetItem

                Resource: !GetAtt OrdersTable.Arn

      Tags:
        - Key: Project
          Value: QuickCart-Day18


  SubmitOrderRole:
    Type: AWS::IAM::Role

    Properties:
      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: SubmitOrder

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem

                Resource: !GetAtt OrdersTable.Arn

              - Effect: Allow

                Action:
                  - states:StartExecution

                Resource: !Sub >-
                  arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:quickcart-order-workflow-${Environment}-iac-day18

      Tags:
        - Key: Project
          Value: QuickCart-Day18


  ValidateOrderFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub quickcart-validate-order-${Environment}-iac-day18

      Description: Validates a QuickCart order before processing.

      Runtime: python3.14

      Handler: index.lambda_handler

      Role: !GetAtt ValidateOrderRole.Arn

      Architectures:
        - x86_64

      MemorySize: 128

      Timeout: 10

      Code:
        ZipFile: |

          def lambda_handler(event, context):

              if event.get("simulateFailure") is True:
                  raise RuntimeError(
                      "Simulated technical failure for retry and catch demonstration"
                  )

              order_id = str(event.get("orderId", "")).strip()
              amount = event.get("amount")

              if not order_id:
                  return {
                      "orderId": order_id,
                      "amount": amount,
                      "status": "REJECTED",
                      "reason": "orderId is required"
                  }

              if (
                  not isinstance(amount, (int, float))
                  or isinstance(amount, bool)
                  or amount <= 0
              ):
                  return {
                      "orderId": order_id,
                      "amount": amount,
                      "status": "REJECTED",
                      "reason": "Amount must be greater than zero"
                  }

              return {
                  "orderId": order_id,
                  "amount": amount,
                  "status": "ACCEPTED"
              }

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  ProcessOrderFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub quickcart-process-order-${Environment}-iac-day18

      Description: Processes the QuickCart order and marks it complete.

      Runtime: python3.14

      Handler: index.lambda_handler

      Role: !GetAtt OrderWorkerRole.Arn

      Architectures:
        - x86_64

      MemorySize: 128

      Timeout: 10

      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable

      Code:
        ZipFile: |

          import os
          from datetime import datetime, timezone
          import boto3

          table = boto3.resource("dynamodb").Table(
              os.environ["TABLE_NAME"]
          )

          def lambda_handler(event, context):

              order_id = event["orderId"]

              now = datetime.now(timezone.utc).isoformat()

              table.update_item(
                  Key={"orderId": order_id},

                  UpdateExpression="SET #status = :status, updatedAt = :updated",

                  ExpressionAttributeNames={
                      "#status": "status"
                  },

                  ExpressionAttributeValues={
                      ":status": "COMPLETED",
                      ":updated": now
                  }
              )

              return {
                  "orderId": order_id,
                  "amount": event["amount"],
                  "status": "COMPLETED",
                  "message": "QuickCart order processed successfully"
              }

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  NotifyOrderFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub quickcart-notify-order-${Environment}-iac-day18

      Description: Sends the final QuickCart order notification.

      Runtime: python3.14

      Handler: index.lambda_handler

      Role: !GetAtt ValidateOrderRole.Arn

      Architectures:
        - x86_64

      MemorySize: 128

      Timeout: 10

      Code:
        ZipFile: |

          import json

          def lambda_handler(event, context):

              print(
                  json.dumps({
                      "notification": "QUICKCART_ORDER_COMPLETED",
                      "orderId": event.get("orderId")
                  })
              )

              return event

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - states.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: QuickCartRunOrderWorkflow

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:
                  - lambda:InvokeFunction

                Resource:
                  - !GetAtt ValidateOrderFunction.Arn
                  - !GetAtt ProcessOrderFunction.Arn
                  - !GetAtt NotifyOrderFunction.Arn

              - Effect: Allow

                Action:
                  - dynamodb:UpdateItem

                Resource: !GetAtt OrdersTable.Arn

      Tags:
        - Key: Project
          Value: QuickCart-Day18


  OrderStateMachine:
    Type: AWS::StepFunctions::StateMachine

    Properties:

      StateMachineName: !Sub quickcart-order-workflow-${Environment}-iac-day18

      StateMachineType: STANDARD

      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn

      DefinitionString: !Sub |

        {
          "Comment": "QuickCart Day 18 order processing workflow",

          "StartAt": "ValidateOrder",

          "States": {

            "ValidateOrder": {

              "Type": "Task",

              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",

              "Parameters": {

                "FunctionName": "${ValidateOrderFunction.Arn}",

                "Payload.$": "$"

              },

              "OutputPath": "$.Payload",

              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "States.TaskFailed"
                  ],

                  "IntervalSeconds": 2,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],

              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],

                  "ResultPath": "$.error",

                  "Next": "MarkTechnicalFailure"
                }
              ],

              "Next": "CheckOrderStatus"
            },


            "CheckOrderStatus": {

              "Type": "Choice",

              "Choices": [

                {
                  "Variable": "$.status",

                  "StringEquals": "ACCEPTED",

                  "Next": "ProcessOrder"
                }

              ],

              "Default": "MarkRejected"
            },


            "ProcessOrder": {

              "Type": "Task",

              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",

              "Parameters": {

                "FunctionName": "${ProcessOrderFunction.Arn}",

                "Payload.$": "$"

              },

              "OutputPath": "$.Payload",

              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "States.TaskFailed"
                  ],

                  "IntervalSeconds": 2,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],

              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],

                  "ResultPath": "$.error",

                  "Next": "MarkTechnicalFailure"
                }
              ],

              "Next": "NotifyCustomer"
            },


            "NotifyCustomer": {

              "Type": "Task",

              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",

              "Parameters": {

                "FunctionName": "${NotifyOrderFunction.Arn}",

                "Payload.$": "$"

              },

              "OutputPath": "$.Payload",

              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException"
                  ],

                  "IntervalSeconds": 2,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],

              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],

                  "ResultPath": "$.error",

                  "Next": "MarkTechnicalFailure"
                }
              ],

              "Next": "OrderCompleted"
            },


            "MarkRejected": {

              "Type": "Task",

              "Resource": "arn:${AWS::Partition}:states:::dynamodb:updateItem",

              "Parameters": {

                "TableName": "${OrdersTable}",

                "Key": {
                  "orderId": {
                    "S.$": "$.orderId"
                  }
                },

                "UpdateExpression":
                  "SET #status = :status, reason = :reason, updatedAt = :updated",

                "ExpressionAttributeNames": {
                  "#status": "status"
                },

                "ExpressionAttributeValues": {

                  ":status": {
                    "S": "REJECTED"
                  },

                  ":reason": {
                    "S.$": "$.reason"
                  },

                  ":updated": {
                    "S.$": "$$.State.EnteredTime"
                  }
                }
              },

              "ResultPath": null,

              "Next": "OrderRejected"
            },


            "MarkTechnicalFailure": {

              "Type": "Task",

              "Resource": "arn:${AWS::Partition}:states:::dynamodb:updateItem",

              "Parameters": {

                "TableName": "${OrdersTable}",

                "Key": {
                  "orderId": {
                    "S.$": "$.orderId"
                  }
                },

                "UpdateExpression":
                  "SET #status = :status, reason = :reason, updatedAt = :updated",

                "ExpressionAttributeNames": {
                  "#status": "status"
                },

                "ExpressionAttributeValues": {

                  ":status": {
                    "S": "FAILED"
                  },

                  ":reason": {
                    "S": "Lambda processing failed after retries"
                  },

                  ":updated": {
                    "S.$": "$$.State.EnteredTime"
                  }
                }
              },

              "ResultPath": null,

              "Next": "TechnicalFailure"
            },


            "OrderCompleted": {
              "Type": "Succeed"
            },


            "OrderRejected": {

              "Type": "Fail",

              "Error": "OrderRejected",

              "Cause": "QuickCart order failed business validation"
            },


            "TechnicalFailure": {

              "Type": "Fail",

              "Error": "TechnicalFailure",

              "Cause": "QuickCart Lambda processing failed after retries"
            }
          }
        }

      Tags:
        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  SubmitOrderFunction:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub quickcart-submit-order-${Environment}-iac-day18

      Description: Receives QuickCart API requests and starts the order workflow.

      Runtime: python3.14

      Handler: index.lambda_handler

      Role: !GetAtt SubmitOrderRole.Arn

      Architectures:
        - x86_64

      MemorySize: 128

      Timeout: 15

      Environment:

        Variables:

          TABLE_NAME: !Ref OrdersTable

          STATE_MACHINE_ARN: !Ref OrderStateMachine

      Code:
        ZipFile: |

          import json
          import math
          import os
          import re
          import uuid

          from datetime import datetime, timezone
          from decimal import Decimal

          import boto3

          table = boto3.resource(
              "dynamodb"
          ).Table(
              os.environ["TABLE_NAME"]
          )

          step_functions = boto3.client(
              "stepfunctions"
          )


          def response(status_code, body):

              return {
                  "statusCode": status_code,

                  "headers": {
                      "content-type": "application/json"
                  },

                  "body": json.dumps(
                      body,
                      default=str
                  )
              }


          def lambda_handler(event, context):

              try:

                  raw_body = event.get("body") or "{}"

                  body = (
                      json.loads(raw_body)
                      if isinstance(raw_body, str)
                      else raw_body
                  )

              except (
                  TypeError,
                  json.JSONDecodeError
              ):

                  return response(
                      400,
                      {
                          "message":
                          "Request body must be valid JSON"
                      }
                  )


              order_id = str(
                  body.get(
                      "orderId",
                      ""
                  )
              ).strip()


              amount = body.get(
                  "amount"
              )


              simulate_failure = (
                  body.get(
                      "simulateFailure"
                  ) is True
              )


              if not order_id:

                  return response(
                      400,
                      {
                          "message":
                          "orderId is required"
                      }
                  )


              if len(order_id) > 100:

                  return response(
                      400,
                      {
                          "message":
                          "orderId must be 100 characters or fewer"
                      }
                  )


              if (
                  not isinstance(
                      amount,
                      (int, float)
                  )
                  or isinstance(
                      amount,
                      bool
                  )
                  or not math.isfinite(
                      amount
                  )
              ):

                  return response(
                      400,
                      {
                          "orderId": order_id,
                          "message":
                          "amount must be a number"
                      }
                  )


              existing = table.get_item(
                  Key={
                      "orderId":
                      order_id
                  }
              ).get(
                  "Item"
              )


              if existing:

                  return response(
                      200,
                      {
                          "orderId":
                          existing["orderId"],

                          "status":
                          existing.get(
                              "status"
                          ),

                          "message":
                          "This orderId already exists; returning its current state"
                      }
                  )


              now = datetime.now(
                  timezone.utc
              ).isoformat()


              table.put_item(

                  Item={

                      "orderId":
                      order_id,

                      "amount":
                      Decimal(
                          str(amount)
                      ),

                      "status":
                      "PROCESSING",

                      "createdAt":
                      now,

                      "updatedAt":
                      now
                  },

                  ConditionExpression:
                      "attribute_not_exists(orderId)"
              )


              execution_name = re.sub(
                  r"[^A-Za-z0-9-_]",
                  "-",
                  order_id
              )[:45]


              execution_name = (
                  execution_name
                  + "-"
                  + uuid.uuid4().hex[:12]
              )


              workflow_input = {

                  "orderId":
                  order_id,

                  "amount":
                  amount,

                  "simulateFailure":
                  simulate_failure
              }


              try:

                  execution = step_functions.start_execution(

                      stateMachineArn:
                      os.environ[
                          "STATE_MACHINE_ARN"
                      ],

                      name:
                      execution_name,

                      input:
                      json.dumps(
                          workflow_input
                      )
                  )


                  execution_arn = execution[
                      "executionArn"
                  ]


                  table.update_item(

                      Key={
                          "orderId":
                          order_id
                      },

                      UpdateExpression:
                          "SET executionArn = :arn",

                      ExpressionAttributeValues:
                          {
                              ":arn":
                              execution_arn
                          }
                  )


                  return response(

                      202,

                      {
                          "orderId":
                          order_id,

                          "status":
                          "PROCESSING",

                          "message":
                          "QuickCart order accepted and workflow started",

                          "executionArn":
                          execution_arn
                      }
                  )


              except Exception as exc:

                  table.update_item(

                      Key={
                          "orderId":
                          order_id
                      },

                      UpdateExpression:
                          "SET #status = :status, reason = :reason, updatedAt = :updated",

                      ExpressionAttributeNames:
                          {
                              "#status":
                              "status"
                          },

                      ExpressionAttributeValues:
                          {

                              ":status":
                              "FAILED_TO_START",

                              ":reason":
                              str(exc)[:500],

                              ":updated":
                              datetime.now(
                                  timezone.utc
                              ).isoformat()
                          }
                  )

                  raise


      Tags:

        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  GetOrderStatusFunction:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub quickcart-get-order-${Environment}-iac-day18

      Description: Returns the current QuickCart order state.

      Runtime: python3.14

      Handler: index.lambda_handler

      Role: !GetAtt GetOrderStatusRole.Arn

      Architectures:
        - x86_64

      MemorySize: 128

      Timeout: 10

      Environment:

        Variables:

          TABLE_NAME:
            !Ref OrdersTable

      Code:
        ZipFile: |

          import json
          import os

          from decimal import Decimal

          import boto3


          table = boto3.resource(
              "dynamodb"
          ).Table(
              os.environ["TABLE_NAME"]
          )


          def json_default(value):

              if isinstance(
                  value,
                  Decimal
              ):

                  return (
                      int(value)
                      if value % 1 == 0
                      else float(value)
                  )

              return str(value)


          def response(
              status_code,
              body
          ):

              return {

                  "statusCode":
                  status_code,

                  "headers": {
                      "content-type":
                      "application/json"
                  },

                  "body":
                  json.dumps(
                      body,
                      default=json_default
                  )
              }


          def lambda_handler(
              event,
              context
          ):

              order_id = (
                  event.get(
                      "pathParameters"
                  ) or {}
              ).get(
                  "orderId",
                  ""
              ).strip()


              if not order_id:

                  return response(
                      400,
                      {
                          "message":
                          "orderId is required"
                      }
                  )


              item = table.get_item(
                  Key={
                      "orderId":
                      order_id
                  }
              ).get(
                  "Item"
              )


              if not item:

                  return response(
                      404,
                      {
                          "orderId":
                          order_id,

                          "message":
                          "Order not found"
                      }
                  )


              visible_fields = {

                  key:
                  item[key]

                  for key in (

                      "orderId",
                      "amount",
                      "status",
                      "reason",
                      "createdAt",
                      "updatedAt",
                      "executionArn"

                  )

                  if key in item
              }


              return response(
                  200,
                  visible_fields
              )

      Tags:

        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  OrdersHttpApi:
    Type: AWS::ApiGatewayV2::Api

    Properties:

      Name: !Sub quickcart-orders-${Environment}-iac-day18

      Description: HTTP API for the QuickCart Day 18 order application.

      ProtocolType: HTTP

      CorsConfiguration:

        AllowOrigins:
          - "*"

        AllowMethods:
          - POST
          - GET
          - OPTIONS

        AllowHeaders:
          - content-type

        MaxAge: 300

      Tags:

        Project: QuickCart-Day18

        Environment: !Ref Environment


  SubmitOrderIntegration:
    Type: AWS::ApiGatewayV2::Integration

    Properties:

      ApiId:
        !Ref OrdersHttpApi

      Description:
        Lambda integration for QuickCart order submission.

      IntegrationType:
        AWS_PROXY

      IntegrationUri:
        !GetAtt SubmitOrderFunction.Arn

      IntegrationMethod:
        POST

      PayloadFormatVersion:
        "2.0"

      TimeoutInMillis:
        30000


  GetOrderStatusIntegration:
    Type: AWS::ApiGatewayV2::Integration

    Properties:

      ApiId:
        !Ref OrdersHttpApi

      Description:
        Lambda integration for QuickCart order status.

      IntegrationType:
        AWS_PROXY

      IntegrationUri:
        !GetAtt GetOrderStatusFunction.Arn

      IntegrationMethod:
        POST

      PayloadFormatVersion:
        "2.0"

      TimeoutInMillis:
        30000


  SubmitOrderRoute:
    Type: AWS::ApiGatewayV2::Route

    Properties:

      ApiId:
        !Ref OrdersHttpApi

      RouteKey:
        POST /orders

      Target:
        !Join
          - /
          - - integrations
            - !Ref SubmitOrderIntegration


  GetOrderStatusRoute:
    Type: AWS::ApiGatewayV2::Route

    Properties:

      ApiId:
        !Ref OrdersHttpApi

      RouteKey:
        GET /orders/{orderId}

      Target:
        !Join
          - /
          - - integrations
            - !Ref GetOrderStatusIntegration


  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage

    Properties:

      ApiId:
        !Ref OrdersHttpApi

      StageName:
        $default

      AutoDeploy:
        true

      Description:
        QuickCart default API stage.

      Tags:

        Project: QuickCart-Day18

        Environment: !Ref Environment


  AllowApiGatewayToInvokeSubmitOrder:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref SubmitOrderFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub >-
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OrdersHttpApi}/*/POST/orders


  AllowApiGatewayToInvokeGetOrderStatus:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref GetOrderStatusFunction

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub >-
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OrdersHttpApi}/*/GET/orders/*


  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        HTTP access to the QuickCart Day 18 classroom UI.

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - Description:
            QuickCart classroom UI over HTTP

          IpProtocol:
            tcp

          FromPort:
            80

          ToPort:
            80

          CidrIp:
            !Ref AllowedHttpCidr

      SecurityGroupEgress:

        - Description:
            Required for package installation and API calls

          IpProtocol:
            -1

          CidrIp:
            0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub quickcart-order-ui-${Environment}-iac-day18

        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


  WebServer:
    Type: AWS::EC2::Instance

    DependsOn:
      - DefaultStage

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      NetworkInterfaces:

        - AssociatePublicIpAddress:
            true

          DeviceIndex:
            "0"

          GroupSet:
            - !Ref WebSecurityGroup

          SubnetId:
            !Ref PublicSubnetId

      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash

            set -e

            dnf install -y nginx

            cat > /usr/share/nginx/html/index.html <<'HTML'

            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>QuickCart Order Portal</title>
              <style>
                :root {
                  color-scheme: dark;
                  font-family: Inter, system-ui, sans-serif;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: #090d16;
                  color: #f1f5f9;
                }

                main {
                  width: min(92vw, 720px);
                  padding: 34px;
                  border: 1px solid #1e293b;
                  border-radius: 18px;
                  background: #111827;
                  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
                }

                h1 {
                  margin: 0 0 8px;
                  color: #10b981;
                }

                p {
                  color: #94a3b8;
                }

                .grid {
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 16px;
                }

                label {
                  display: grid;
                  gap: 7px;
                  font-weight: 650;
                  color: #cbd5e1;
                }

                input {
                  width: 100%;
                  border: 1px solid #334155;
                  border-radius: 9px;
                  padding: 12px;
                  background: #0f172a;
                  color: #fff;
                }

                input:focus {
                  outline: none;
                  border-color: #10b981;
                }

                .check {
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  margin: 17px 0;
                  font-weight: 500;
                  color: #cbd5e1;
                }

                .check input {
                  width: auto;
                  accent-color: #10b981;
                }

                button {
                  width: 100%;
                  border: 0;
                  border-radius: 9px;
                  padding: 13px;
                  background: #10b981;
                  color: #064e3b;
                  font-weight: 800;
                  cursor: pointer;
                  transition: background 0.2s;
                }

                button:hover {
                  background: #059669;
                }

                button:disabled {
                  opacity: .55;
                  cursor: wait;
                }

                pre {
                  min-height: 125px;
                  overflow: auto;
                  padding: 16px;
                  border-radius: 10px;
                  background: #030712;
                  border: 1px solid #1f2937;
                  color: #34d399;
                  white-space: pre-wrap;
                }

                .hint {
                  font-size: .9rem;
                }

                @media (max-width: 600px) {
                  .grid {
                    grid-template-columns: 1fr;
                  }
                  main {
                    padding: 24px;
                  }
                }
              </style>
            </head>
            <body>
              <main>
                <h1>QuickCart Order Portal</h1>
                <p>UI → API Gateway → Lambda → Step Functions → DynamoDB</p>

                <form id="order-form">
                  <div class="grid">
                    <label>
                      Order ID
                      <input id="order-id" required value="QC-UI-1801" maxlength="100">
                    </label>
                    <label>
                      Amount
                      <input id="amount" required type="number" min="0" step="0.01" value="4500">
                    </label>
                  </div>

                  <label class="check">
                    <input id="simulate-failure" type="checkbox">
                    Simulate technical failure to demonstrate retry and catch
                  </label>

                  <button id="submit-button" type="submit">
                    Place QuickCart Order
                  </button>
                </form>

                <p class="hint">
                  Use a new Order ID for each test. Amount 0 demonstrates business rejection.
                </p>

                <pre id="result">Ready.</pre>
              </main>

              <script>
                const API_URL =
                  "https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}";

                const form = document.getElementById("order-form");
                const result = document.getElementById("result");
                const button = document.getElementById("submit-button");
                const terminalStates = new Set(["COMPLETED", "REJECTED", "FAILED", "FAILED_TO_START"]);

                function show(data) {
                  result.textContent = JSON.stringify(data, null, 2);
                }

                async function getStatus(orderId) {
                  const response = await fetch(
                    API_URL
                    + "/orders/"
                    + encodeURIComponent(orderId)
                  );

                  const data = await response.json();

                  if (!response.ok) {
                    throw new Error(
                      data.message
                      || "Status request failed"
                    );
                  }

                  return data;
                }

                async function poll(orderId) {
                  for (
                    let attempt = 1;
                    attempt <= 30;
                    attempt += 1
                  ) {
                    await new Promise(
                      resolve =>
                        setTimeout(
                          resolve,
                          2000
                        )
                    );

                    const order =
                      await getStatus(
                        orderId
                      );

                    show({
                      pollAttempt:
                        attempt,

                      order:
                        order
                    });

                    if (
                      terminalStates.has(
                        order.status
                      )
                    ) {
                      return order;
                    }
                  }

                  throw new Error(
                    "Polling stopped after 60 seconds. Check Step Functions and DynamoDB."
                  );
                }

                form.addEventListener(
                  "submit",
                  async event => {
                    event.preventDefault();
                    button.disabled =
                      true;
                    result.textContent =
                      "Submitting QuickCart order...";

                    const orderId =
                      document
                        .getElementById(
                          "order-id"
                        )
                        .value
                        .trim();

                    const payload = {
                      orderId:
                        orderId,

                      amount:
                        Number(
                          document
                            .getElementById(
                              "amount"
                            )
                            .value
                        ),

                      simulateFailure:
                        document
                          .getElementById(
                            "simulate-failure"
                          )
                          .checked
                    };

                    try {
                      const response =
                        await fetch(
                          API_URL
                          + "/orders",
                          {

                            method:
                              "POST",

                            headers: {
                              "content-type":
                                "application/json"
                            },

                            body:
                              JSON.stringify(
                                payload
                              )

                          }
                        );

                      const data =
                        await response.json();

                      show(data);

                      if (!response.ok) {
                        throw new Error(
                          data.message
                          || "QuickCart order submission failed"
                        );
                      }

                      if (
                        data.status
                        === "PROCESSING"
                      ) {
                        await poll(
                          orderId
                        );
                      }

                    } catch (error) {
                      show({
                        error:
                          error.message
                      });

                    } finally {
                      button.disabled =
                        false;
                    }

                  }
                );
              </script>
            </body>
            </html>

            HTML

            systemctl enable --now nginx


      Tags:

        - Key: Name
          Value: !Sub quickcart-order-ui-${Environment}-iac-day18

        - Key: Project
          Value: QuickCart-Day18

        - Key: Environment
          Value: !Ref Environment


Outputs:

  WebsiteUrl:

    Description:
      QuickCart web application URL.

    Value:
      !Sub http://${WebServer.PublicDnsName}


  WebsitePublicIp:

    Description:
      Public IPv4 address of the QuickCart EC2 UI.

    Value:
      !GetAtt WebServer.PublicIp


  ApiBaseUrl:

    Description:
      QuickCart HTTP API base URL.

    Value:
      !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}


  SubmitOrderEndpoint:

    Description:
      POST a QuickCart order to this endpoint.

    Value:
      !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/orders


  GetOrderStatusEndpointPattern:

    Description:
      Replace orderId with the submitted QuickCart order identifier.

    Value:
      !Sub https://${OrdersHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/orders/{orderId}


  OrdersTableName:

    Description:
      DynamoDB table used to persist QuickCart order state.

    Value:
      !Ref OrdersTable


  StateMachineArn:

    Description:
      ARN of the QuickCart Standard Step Functions workflow.

    Value:
      !Ref OrderStateMachine


  WebServerInstanceId:

    Description:
      EC2 instance hosting the QuickCart demonstration UI.

    Value:
      !Ref WebServer


  LambdaFailureQueueUrl:

    Description:
      SQS queue used as the Lambda asynchronous failure destination.

    Value:
      !Ref LambdaFailureQueue


  LambdaFailureQueueArn:

    Description:
      ARN of the QuickCart Lambda failure queue.

    Value:
      !GetAtt LambdaFailureQueue.Arn


  LambdaFailureQueueVisibilityTimeout:

    Description:
      Current SQS visibility timeout.

    Value:
      !Ref QueueVisibilityTimeout


  ArchiveBucketName:

    Description: >-
      Retained QuickCart S3 archive bucket. It will not be deleted when
      the CloudFormation stack is deleted.

    Value:
      !Ref ArchiveBucket


  ArchiveBucketArn:

    Description:
      ARN of the retained QuickCart archive bucket.

    Value:
      !GetAtt ArchiveBucket.Arn